services:
  dashboard:
    container_name: dashboard
    build:
      context: ./dashboard
      dockerfile: Dockerfile.local
    ports:
      - "5173:5173"
    networks:
      - app-network
    env_file:
      - .env.local
    volumes:
      - ./dashboard:/app
      - /app/node_modules
    depends_on:
      - trader-core

  trader-core:
    container_name: trader-core-local
    build:
      context: .
      dockerfile: trader-core/Dockerfile.local
    expose:
      - "8080"
    ports:
      - "8080:8080"
    networks:
      - app-network
    env_file:
      - .env.local
    environment:
      - BACKTESTER_URL=http://research:8000
      - SENTIMENT_URL=http://sentiment:8002/predict
    volumes:
      - ./trader-core:/app
      - ./shared:/app/shared
      - /root/go/pkg:/root/go/pkg

  research:
    container_name: research-local
    build:
      context: .
      dockerfile: research/Dockerfile.local
    ports:
      - "8000:8000"
    networks:
      - app-network
    env_file:
      - .env.local
    volumes:
      - ./research:/app
      - ./shared:/app/shared

  # sentiment http-strategy service (scores a news RSS feed; see scripts/sentiment_service.py)
  sentiment:
    container_name: sentiment-local
    build:
      context: .
      dockerfile: research/Dockerfile.local
    ports:
      - "8002:8002"
    networks:
      - app-network
    env_file:
      - .env.local
    environment:
      - HOST=0.0.0.0
      - PORT=8002
    volumes:
      - ./scripts:/app/scripts
    command: ["python3", "scripts/sentiment_service.py"]

networks:
  app-network:

