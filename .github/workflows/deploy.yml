name: Deploy

# Deploys the prod compose stack to the server on every push to dev/main
# (and on manual dispatch). The main CI (ci.yml) still gates every push.
#
# Required repository secrets (Settings > Secrets and variables > Actions):
#   DEPLOY_HOST     - server hostname or IP
#   DEPLOY_USER     - SSH user
#   DEPLOY_SSH_KEY  - private key authorized for that user (repo deploy key)
#   DEPLOY_PATH     - app directory on the server (a checkout of this repo)
# Optional:
#   DEPLOY_PORT     - SSH port (default 22)
#
# If DEPLOY_HOST is not set, the deploy step is skipped (workflow stays green).
on:
  push:
    branches: [dev, main]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy (docker compose prod)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy via SSH
        if: ${{ secrets.DEPLOY_HOST != '' }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || '22' }}
          script: |
            cd "${{ secrets.DEPLOY_PATH }}"
            git fetch --all --prune
            git checkout "${{ github.ref_name }}"
            git reset --hard "origin/${{ github.ref_name }}"
            docker compose -f docker-compose.prod.yml up -d --build --remove-orphans

      - name: Skipped (no DEPLOY_HOST secret)
        if: ${{ secrets.DEPLOY_HOST == '' }}
        run: echo "DEPLOY_HOST secret not set — skipping deploy (CI-only run)."
