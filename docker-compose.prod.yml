services:
  loadbalancer:
    container_name: algo-trader-loadbalancer
    restart: unless-stopped
    image: nginx:1.27.5-alpine-slim
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs/tradr.crt:/etc/nginx/certs/tradr.crt:ro
      - ./certs/tradr.key:/etc/nginx/certs/tradr.key:ro
    depends_on:
      - dashboard
      - trader-core
    networks:
      - app-network

  dashboard:
    container_name: dashboard
    restart: unless-stopped
    build:
      context: ./dashboard
      dockerfile: Dockerfile.prod
    networks:
      - app-network
    env_file:
      - .env.prod
    depends_on:
      - trader-core

  trader-core:
    container_name: trader-core
    restart: unless-stopped
    build:
      context: .
      dockerfile: trader-core/Dockerfile.prod
    expose:
      - "8080"
    networks:
      - app-network
    env_file:
      - .env.prod
    environment:
      - BACKTESTER_URL=http://research:8000
      - SENTIMENT_URL=http://sentiment:8002/predict
    volumes:
      - ./logs:/app/logs

  research:
    container_name: research
    restart: unless-stopped
    build:
      context: .
      dockerfile: research/Dockerfile.prod
    expose:
      - "8000"
    networks:
      - app-network
    env_file:
      - .env.prod

  # sentiment http-strategy service (scores a news RSS feed; see scripts/sentiment_service.py)
  sentiment:
    container_name: sentiment
    restart: unless-stopped
    build:
      context: .
      dockerfile: research/Dockerfile.prod
    expose:
      - "8002"
    networks:
      - app-network
    env_file:
      - .env.prod
    environment:
      - HOST=0.0.0.0
      - PORT=8002
    command: ["python3", "scripts/sentiment_service.py"]

networks:
  app-network:

