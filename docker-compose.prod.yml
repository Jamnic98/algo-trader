services:
  loadbalancer:
    container_name: algo-trader-loadbalancer
    image: nginx:1.27.5-alpine-slim
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs/tradr.crt:/etc/nginx/certs/tradr.crt:ro
      - ./certs/tradr.key:/etc/nginx/certs/tradr.key:ro
    depends_on:
      - dashboard
      - trader-core
    networks:
      - app-network

  dashboard:
    container_name: dashboard
    build:
      context: ./dashboard
      dockerfile: Dockerfile.prod
    networks:
      - app-network
    env_file:
      - .env.prod
    depends_on:
      - trader-core

  trader-core:
    container_name: trader-core
    build:
      context: ./trader-core
      dockerfile: Dockerfile.prod
    expose:
      - "8080"
    networks:
      - app-network
    env_file:
      - .env.prod
    volumes:
      - ./logs:/app/logs

networks:
  app-network:

